<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23a855f7'/%3E%3Ccircle cx='20' cy='20' r='11' fill='none' stroke='%239333ea' stroke-width='4.5'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23faf5ff'/%3E%3C/svg%3E">
  <link rel="icon" type="image/webp" href="/static/assets/images/favicon-color.webp">
  <link rel="shortcut icon" href="/static/assets/images/favicon-color.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/static/assets/images/apple-touch-icon.png">
  <title>Reset Password - TyresVision</title>
  <link rel="stylesheet" href="/static/internal.css" />
</head>
<body class="font-quicksand min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/assets/images/tyresvision-logo.png" alt="TyresVision" class="h-9 w-auto object-contain select-none mx-auto mb-2" />
      <p class="text-xs text-slate-500 font-medium">Scraping Dashboard</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <div id="missing-token-state" class="hidden">
        <h2 class="text-lg font-semibold text-slate-900 mb-1">Invalid reset link</h2>
        <p class="text-sm text-slate-500 mb-6">This link is missing its reset token. Request a new one below.</p>
        <a href="/tcsadmin/forgot-password"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700">
          Request a new link
        </a>
      </div>

      <form id="reset-form" novalidate>
        <h2 class="text-lg font-semibold text-slate-900 mb-1">Set a new password</h2>
        <p class="text-sm text-slate-500 mb-6">Choose a new password for your account.</p>

        <div id="form-error" class="hidden mb-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm px-4 py-3"></div>
        <div id="form-success" class="hidden mb-4 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 text-sm px-4 py-3"></div>

        <div class="mb-4">
          <label for="new-password" class="block text-sm font-medium text-slate-700 mb-1.5">New password</label>
          <div class="relative">
            <input type="password" id="new-password" name="new_password" autocomplete="new-password" required
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 pr-11 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-emerald-500"
              placeholder="At least 8 characters" />
            <button type="button" data-toggle-password="new-password" tabindex="-1"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 cursor-pointer">
              <svg class="icon-eye-open w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <svg class="icon-eye-closed hidden w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <div class="mb-6">
          <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1.5">Confirm new password</label>
          <div class="relative">
            <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 pr-11 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-emerald-500"
              placeholder="••••••••" />
            <button type="button" data-toggle-password="confirm-password" tabindex="-1"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 cursor-pointer">
              <svg class="icon-eye-open w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <svg class="icon-eye-closed hidden w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="submit-label">Reset password</span>
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        <a href="/tcsadmin/login" class="font-medium text-[#a855f7] hover:text-blue-700">Back to sign in</a>
      </p>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">© TyresVision. All rights reserved.</p>
  </div>

  <script src="/static/admin.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');
    const spinner = document.getElementById('spinner');
    const formError = document.getElementById('form-error');
    const formSuccess = document.getElementById('form-success');

    if (!token) {
      form.classList.add('hidden');
      document.getElementById('missing-token-state').classList.remove('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.classList.toggle('hidden', !isLoading);
      submitLabel.textContent = isLoading ? 'Resetting…' : 'Reset password';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.classList.add('hidden');
      formSuccess.classList.add('hidden');

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!newPassword || !confirmPassword) {
        formError.textContent = 'Both fields are required.';
        formError.classList.remove('hidden');
        return;
      }
      if (newPassword !== confirmPassword) {
        formError.textContent = 'Passwords do not match.';
        formError.classList.remove('hidden');
        return;
      }
      if (newPassword.length < 8) {
        formError.textContent = 'Password must be at least 8 characters.';
        formError.classList.remove('hidden');
        return;
      }

      setLoading(true);
      try {
        const response = await fetch('/tcsadmin/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          formError.textContent = data.error || 'Unable to reset password. Please try again.';
          formError.classList.remove('hidden');
          setLoading(false);
          return;
        }

        formSuccess.textContent = data.message || 'Your password has been reset.';
        formSuccess.classList.remove('hidden');
        form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
        setTimeout(() => {
          window.location.href = '/tcsadmin/login';
        }, 2000);
      } catch (err) {
        formError.textContent = 'Network error. Please try again.';
        formError.classList.remove('hidden');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
