<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23a855f7'/%3E%3Ccircle cx='20' cy='20' r='11' fill='none' stroke='%239333ea' stroke-width='4.5'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23faf5ff'/%3E%3C/svg%3E">
  <link rel="icon" type="image/webp" href="/static/assets/images/favicon-color.webp">
  <link rel="shortcut icon" href="/static/assets/images/favicon-color.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/static/assets/images/apple-touch-icon.png">
  <title>Forgot Password - TyresVision</title>
  <link rel="stylesheet" href="/static/internal.css" />
</head>
<body class="font-quicksand min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/assets/images/tyresvision-logo.png" alt="TyresVision" class="h-9 w-auto object-contain select-none mx-auto mb-2" />
      <p class="text-xs text-slate-500 font-medium">Scraping Dashboard</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <h2 class="text-lg font-semibold text-slate-900 mb-1">Forgot your password?</h2>
      <p class="text-sm text-slate-500 mb-6">Enter your email and we'll send you a link to reset it.</p>

      <div id="form-message" class="hidden mb-4 rounded-lg text-sm px-4 py-3"></div>

      <form id="forgot-form" novalidate>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-emerald-500"
            placeholder="you@example.com" />
          <p id="email-error" class="hidden mt-1.5 text-xs text-rose-600"></p>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="submit-label">Send reset link</span>
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        <a href="/tcsadmin/login" class="font-medium text-[#a855f7] hover:text-blue-700">Back to sign in</a>
      </p>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">© TyresVision. All rights reserved.</p>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('email-error');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');
    const spinner = document.getElementById('spinner');
    const formMessage = document.getElementById('form-message');

    function showMessage(text, isError) {
      formMessage.textContent = text;
      formMessage.classList.remove('hidden', 'bg-rose-50', 'border', 'border-rose-200', 'text-rose-700', 'bg-blue-50', 'border-blue-200', 'text-blue-700');
      formMessage.classList.add(...(isError
        ? ['bg-rose-50', 'border', 'border-rose-200', 'text-rose-700']
        : ['bg-blue-50', 'border', 'border-blue-200', 'text-blue-700']));
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.classList.toggle('hidden', !isLoading);
      submitLabel.textContent = isLoading ? 'Sending…' : 'Send reset link';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      emailError.classList.add('hidden');
      formMessage.classList.add('hidden');

      const email = emailInput.value.trim();
      if (!email) {
        emailError.textContent = 'Email is required.';
        emailError.classList.remove('hidden');
        return;
      }

      setLoading(true);
      try {
        const response = await fetch('/tcsadmin/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          showMessage(data.error || 'Something went wrong. Please try again.', true);
          return;
        }

        showMessage(data.message || 'A password reset link has been sent to your email.', false);
        form.reset();
      } catch (err) {
        showMessage('Network error. Please try again.', true);
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
