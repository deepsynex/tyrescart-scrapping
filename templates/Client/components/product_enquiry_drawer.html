<!-- ==========================================================================
     TYRESVISION PRODUCT ENQUIRY OVERVIEW DRAWER (EXACT MATCH TO REFERENCE DESIGN)
     Slides in RIGHT TO LEFT when 'Contact' is clicked on any tyre card.
     ========================================================================== -->

<!-- Backdrop Overlay -->
<div 
  id="tvProductEnquiryBackdrop" 
  class="tv-pe-backdrop" 
  onclick="closeProductEnquiryDrawer()" 
  aria-hidden="true"
></div>

<!-- Drawer Panel (Right to Left) -->
<aside 
  id="tvProductEnquiryPanel" 
  class="tv-pe-panel" 
  role="dialog" 
  aria-modal="true" 
  aria-labelledby="tvPeTitle"
>
  <!-- 1. Header: PRODUCT ENQUIRY + Close (X) button -->
  <div class="tv-pe-header">
    <h2 id="tvPeTitle" class="tv-pe-title">
      <span class="tv-pe-title-dark">PRODUCT</span>
      <span class="tv-pe-title-purple">ENQUIRY</span>
    </h2>

    <button 
      type="button" 
      onclick="closeProductEnquiryDrawer()" 
      class="tv-pe-close-btn" 
      aria-label="Close Product Enquiry"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="18" x2="6" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- 2. Body -->
  <div class="tv-pe-body">
    <!-- Product Label & Name -->
    <div class="tv-pe-product-block">
      <span class="tv-pe-product-label">Product</span>
      <h3 id="tvPeProductName" class="tv-pe-product-name">Tyre Product</h3>
    </div>

    <!-- Form -->
    <form id="tvProductEnquiryForm" onsubmit="handleProductEnquirySubmit(event)" novalidate class="tv-pe-form">
      <input type="hidden" id="tvPeHiddenProductName" name="product_name" value="">

      <!-- Row 1: Name * and Phone * (2 columns) -->
      <div class="tv-pe-row-2col">
        <div class="tv-pe-field">
          <label for="tvPeName" class="tv-pe-label">
            Name <span class="tv-pe-req">*</span>
          </label>
          <input 
            type="text" 
            id="tvPeName" 
            name="name" 
            required 
            class="tv-pe-input"
            autocomplete="name"
          />
        </div>

        <div class="tv-pe-field">
          <label for="tvPePhone" class="tv-pe-label">
            Phone <span class="tv-pe-req">*</span>
          </label>
          <input 
            type="tel" 
            id="tvPePhone" 
            name="phone" 
            required 
            class="tv-pe-input"
            autocomplete="tel"
          />
        </div>
      </div>

      <!-- Row 2: Email * (full width) -->
      <div class="tv-pe-field">
        <label for="tvPeEmail" class="tv-pe-label">
          Email <span class="tv-pe-req">*</span>
        </label>
        <input 
          type="email" 
          id="tvPeEmail" 
          name="email" 
          required 
          class="tv-pe-input"
          autocomplete="email"
        />
      </div>

      <!-- Row 3: Comment (textarea) -->
      <div class="tv-pe-field">
        <label for="tvPeComment" class="tv-pe-label">
          Comment
        </label>
        <textarea 
          id="tvPeComment" 
          name="comment" 
          rows="5" 
          class="tv-pe-textarea"
        ></textarea>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="tvPeAlert" class="hidden tv-pe-alert"></div>

      <!-- Submit Button (Left aligned, solid black) -->
      <div class="tv-pe-submit-row">
        <button type="submit" id="tvPeSubmitBtn" class="tv-pe-submit-btn">
          <span class="btn-text">SUBMIT</span>
          <span class="btn-spinner hidden inline-flex items-center gap-2">
            <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>SUBMITTING...</span>
          </span>
        </button>
      </div>
    </form>
  </div>
</aside>
