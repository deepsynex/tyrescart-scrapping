<!-- ==========================================================================
     TYRESVISION PRODUCT ENQUIRY OVERVIEW DRAWER (QUICK VIEW DRAWER DESIGN)
     Slides in RIGHT TO LEFT with signature left accent border & rounded corners.
     ========================================================================== -->

<!-- Backdrop Overlay -->
<div 
  id="tvProductEnquiryBackdrop" 
  class="tv-pe-backdrop" 
  onclick="closeProductEnquiryDrawer()" 
  aria-hidden="true"
></div>

<!-- Drawer Panel (Right to Left Slide) -->
<aside 
  id="tvProductEnquiryPanel" 
  class="tv-pe-panel" 
  role="dialog" 
  aria-modal="true" 
  aria-labelledby="tvPeTitle"
>
  <!-- 1. Header Bar matching Quick View -->
  <div class="tv-pe-header">
    <div class="tv-pe-header-title-wrap">
      <h2 id="tvPeTitle" class="tv-pe-modal-title">Product Enquiry</h2>
      <div class="tv-qv-title-bar"></div>
    </div>

    <button 
      type="button" 
      onclick="closeProductEnquiryDrawer()" 
      class="tv-pe-close-btn" 
      aria-label="Close Product Enquiry"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="18" x2="6" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- 2. Body -->
  <div class="tv-pe-body">
    <!-- Quick View Product Showcase Card -->
    <div class="tv-pe-product-card">
      <div class="tv-pe-card-top">
        <div class="tv-pe-brand-wrap">
          <img id="tvPeBrandLogo" src="" alt="Brand Logo" class="tv-pe-brand-img" style="display:none;" onerror="this.style.display='none'; document.getElementById('tvPeBrandFallback').style.display='inline-block';">
          <span id="tvPeBrandFallback" class="tv-pe-brand-fallback">TYRESVISION</span>
        </div>
        <div class="tv-pe-status-tags">
          <span class="tv-pe-stock-pill">
            <span class="tv-pe-pulse-dot"></span> In Stock
          </span>
          <span id="tvPeSpecWarranty" class="tv-pe-warranty-pill">1 Year Warranty</span>
        </div>
      </div>

      <div class="tv-pe-product-hero">
        <div class="tv-pe-stage">
          <div class="tv-pe-stage-glow"></div>
          <img id="tvPeImg" src="/static/assets/images/no-image-available.svg" alt="Tyre Product" class="tv-pe-img" loading="eager" onerror="this.src='/static/assets/images/no-image-available.svg'">
        </div>
        <div class="tv-pe-hero-details">
          <h3 id="tvPeProductName" class="tv-pe-product-name">Tyre Product</h3>
          <div class="tv-pe-chips-row">
            <span class="tv-pe-chip tv-chip-size">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle></svg>
              <strong id="tvPeSpecSize">Standard Size</strong>
            </span>
            <span class="tv-pe-chip tv-chip-year">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
              <span id="tvPeSpecYear">2026</span>
            </span>
            <span class="tv-pe-chip tv-chip-country">
              <span id="tvPeCountryFlagWrap" class="tv-pe-flag-wrap">
                <img id="tvPeSpecCountryFlag" src="" alt="Country Flag" class="tv-pe-chip-flag" style="display: none;" onerror="this.style.display='none'; var ic = document.getElementById('tvPeCountryIcon'); if(ic) ic.style.display='inline-block';">
                <svg id="tvPeCountryIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line></svg>
              </span>
              <span id="tvPeSpecCountry">China</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Pricing Bar -->
      <div class="tv-pe-pricing-strip">
        <div class="tv-pe-price-main">
          <span class="tv-pe-price-label">Price per tyre:</span>
          <div class="tv-pe-price-val">
            <span class="currency-dirham tv-pe-curr">&#xe900;</span>
            <strong id="tvPePrice">--</strong>
            <span class="tv-pe-unit">/ tyre</span>
          </div>
        </div>
        <div class="tv-pe-price-set4">
          <span class="tv-pe-price-label">Set of 4:</span>
          <div class="tv-pe-set4-val">
            <span class="currency-dirham tv-pe-curr-sm">&#xe900;</span>
            <strong id="tvPePriceSet4">--</strong>
          </div>
        </div>
      </div>
    </div>
    <!-- Form -->
    <form id="tvProductEnquiryForm" onsubmit="handleProductEnquirySubmit(event)" novalidate class="tv-pe-form">
      <input type="hidden" id="tvPeHiddenProductName" name="product_name" value="">

      <!-- Row 1: Name * and Phone * (2 columns) -->
      <div class="tv-pe-row-2col">
        <div class="tv-pe-field">
          <label for="tvPeName" class="tv-pe-label">
            Name <span class="tv-pe-req">*</span>
          </label>
          <div class="tv-pe-input-wrap">
            <svg class="tv-pe-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              id="tvPeName" 
              name="name" 
              required 
              placeholder="e.g. Mohammed"
              class="tv-pe-input"
              autocomplete="name"
            />
          </div>
        </div>

        <div class="tv-pe-field">
          <label for="tvPePhone" class="tv-pe-label">
            Phone / WhatsApp <span class="tv-pe-req">*</span>
          </label>
          <div class="tv-pe-input-wrap">
            <svg class="tv-pe-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <input 
              type="tel" 
              id="tvPePhone" 
              name="phone" 
              required 
              placeholder="+971 50 123 4567"
              class="tv-pe-input"
              autocomplete="tel"
            />
          </div>
        </div>
      </div>

      <!-- Row 2: Email * (full width) -->
      <div class="tv-pe-field">
        <label for="tvPeEmail" class="tv-pe-label">
          Email <span class="tv-pe-req">*</span>
        </label>
        <div class="tv-pe-input-wrap">
          <svg class="tv-pe-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <input 
            type="email" 
            id="tvPeEmail" 
            name="email" 
            required 
            placeholder="name@example.com"
            class="tv-pe-input"
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Row 3: Comment (textarea) -->
      <div class="tv-pe-field">
        <label for="tvPeComment" class="tv-pe-label">
          Comment / Location Preference
        </label>
        <div class="tv-pe-input-wrap">
          <textarea 
            id="tvPeComment" 
            name="comment" 
            rows="3" 
            placeholder="Ask questions about stock, doorstep mobile fitting, or fitting centre..."
            class="tv-pe-textarea"
          ></textarea>
        </div>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="tvPeAlert" class="hidden tv-pe-alert"></div>

      <!-- Submit Button -->
      <div class="tv-pe-submit-row">
        <button type="submit" id="tvPeSubmitBtn" class="tv-pe-submit-btn">
          <span class="btn-text">
            <span>SUBMIT ENQUIRY</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
          <span class="btn-spinner hidden inline-flex items-center gap-2">
            <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>SUBMITTING...</span>
          </span>
        </button>
      </div>

      <!-- Trust Badges Strip -->
      <div class="tv-pe-trust-strip">
        <div class="tv-pe-trust-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[#7C3AED]"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>100% Genuine</span>
        </div>
        <div class="tv-pe-trust-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[#7C3AED]"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span>Instant Quote</span>
        </div>
        <div class="tv-pe-trust-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[#7C3AED]"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
          <span>Mobile Van Fitting</span>
        </div>
      </div>
    </form>
  </div>
</aside>
