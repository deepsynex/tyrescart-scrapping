<!-- ==========================================================================
     TYRESVISION CONTACT OVERVIEW DRAWER (SLIDES IN RIGHT TO LEFT)
     Triggered by desktop Header 'Contact' button.
     Accessible, responsive, and connected to Gmail SMTP + hdweb_enquiry DB.
     ========================================================================== -->

<!-- ── Backdrop Overlay ── -->
<div 
  id="tvContactDrawerBackdrop" 
  class="tv-contact-drawer-backdrop" 
  onclick="closeContactDrawer()" 
  aria-hidden="true"
></div>

<!-- ── Contact Drawer Panel (Right-to-Left Slide) ── -->
<aside 
  id="tvContactDrawerPanel" 
  class="tv-contact-drawer-panel" 
  role="dialog" 
  aria-modal="true" 
  aria-labelledby="tvContactDrawerTitle"
>
  <!-- Drawer Header -->
  <div class="tv-contact-drawer-header">
    <div class="tv-contact-header-left">
      <div class="tv-contact-logo-mark" style="background: transparent; box-shadow: none; padding: 0;">
        <img src="{{ url_for('static', filename='assets/images/logo/tyresvision-icon-symbol.png') }}"
             alt="TyresVision"
             class="w-full h-full object-contain rounded-xl"
             width="38"
             height="38" />
      </div>
      <div>
        <h2 id="tvContactDrawerTitle" class="tv-contact-title">Contact &amp; Overview</h2>
        <div class="tv-qv-title-bar"></div>
      </div>
    </div>

    <button 
      type="button" 
      onclick="closeContactDrawer()" 
      class="tv-contact-close-btn" 
      aria-label="Close Contact Drawer"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="18" x2="6" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Drawer Body (Scrollable) -->
  <div class="tv-contact-drawer-body">
    <!-- Intro Banner -->
    <div class="tv-contact-intro-card">
      <div class="flex items-center gap-1.5 text-xs font-bold text-[#7C3AED] mb-1">
        <span class="w-2 h-2 rounded-full bg-[#7C3AED] animate-pulse"></span>
        <span>Fast Support &bull; Response in Minutes</span>
      </div>
      <h3 class="text-base sm:text-lg font-black text-slate-900 leading-snug">Get in Touch with our Tyre Specialists</h3>
      <p class="text-xs text-slate-500 mt-1 leading-relaxed">
        Need pricing, fitment advice, or mobile fitting at your doorstep? Send us a message or reach us directly.
      </p>
    </div>

    <!-- Contact Form for Mail -->
    <form id="tvContactDrawerForm" onsubmit="handleContactDrawerSubmit(event)" novalidate class="tv-contact-form">
      <!-- Full Name -->
      <div class="tv-form-group">
        <label for="tvContactName" class="tv-form-label">
          Full Name <span class="text-rose-500">*</span>
        </label>
        <div class="tv-input-wrap">
          <svg class="tv-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type="text" 
            id="tvContactName" 
            name="name" 
            required 
            placeholder="e.g. Mohammed Al Mansoori" 
            class="tv-form-input"
            autocomplete="name"
          />
        </div>
      </div>

      <!-- Email Address -->
      <div class="tv-form-group">
        <label for="tvContactEmail" class="tv-form-label">
          Email Address <span class="text-rose-500">*</span>
        </label>
        <div class="tv-input-wrap">
          <svg class="tv-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <input 
            type="email" 
            id="tvContactEmail" 
            name="email" 
            required 
            placeholder="name@example.com" 
            class="tv-form-input"
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Phone Number -->
      <div class="tv-form-group">
        <label for="tvContactPhone" class="tv-form-label">
          Phone Number / WhatsApp
        </label>
        <div class="tv-input-wrap">
          <svg class="tv-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <input 
            type="tel" 
            id="tvContactPhone" 
            name="phone" 
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{10}"
            oninput="this.value = this.value.replace(/\D/g, '').slice(0, 10)"
            placeholder="0501234567" 
            class="tv-form-input"
            autocomplete="tel"
          />
        </div>
      </div>

      <!-- Subject / Service Category -->
      <div class="tv-form-group">
        <label for="tvContactSubject" class="tv-form-label">
          Enquiry Subject
        </label>
        <div class="tv-input-wrap">
          <svg class="tv-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <select id="tvContactSubject" name="subject" class="tv-form-input tv-form-select">
            <option value="Tyre Price Quote & Recommendations">Tyre Price Quote &amp; Recommendations</option>
            <option value="Doorstep Mobile Van Fitting in UAE">Doorstep Mobile Van Fitting in UAE</option>
            <option value="Wheel Alignment & Balancing Service">Wheel Alignment &amp; Balancing Service</option>
            <option value="Price Match Guarantee Enquiry">Price Match Guarantee Enquiry</option>
            <option value="Fleet & Business Enquiry">Fleet &amp; Business Tyre Supply</option>
            <option value="General Question / Customer Support">General Question / Customer Support</option>
          </select>
        </div>
      </div>

      <!-- Message / Tyre Size details -->
      <div class="tv-form-group">
        <label for="tvContactMessage" class="tv-form-label">
          Message &bull; Tyre Size / Vehicle Details <span class="text-rose-500">*</span>
        </label>
        <textarea 
          id="tvContactMessage" 
          name="message" 
          rows="4" 
          required 
          placeholder="Please tell us your tyre size (e.g. 235/55 R19) or vehicle make/model and any question you have..." 
          class="tv-form-textarea"
        ></textarea>
      </div>

      <!-- Trust note -->
      <div class="tv-contact-trust-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-emerald-600 flex-shrink-0">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>100% Genuine tyres, official manufacturer warranties &amp; transparent upfront pricing.</span>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="tvContactAlert" class="hidden rounded-xl p-3.5 mb-3 text-xs sm:text-sm font-semibold transition-all"></div>

      <!-- Submit Button -->
      <button type="submit" id="tvContactSubmitBtn" class="tv-contact-submit-btn">
        <span class="tv-submit-btn-content inline-flex items-center justify-center gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span class="btn-text font-bold">Send Message</span>
        </span>
        <span class="tv-submit-spinner hidden inline-flex items-center justify-center gap-2">
          <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="font-bold">Sending Message...</span>
        </span>
      </button>
    </form>
  </div>
</aside>
