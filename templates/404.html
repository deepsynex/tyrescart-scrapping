<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <title>404 - Page Not Found</title>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen w-full flex flex-col items-center justify-between bg-white text-slate-900 p-6 sm:p-12 selection:bg-slate-900 selection:text-white">
  
  <div></div>

  <!-- Center 404 Content -->
  <main class="w-full max-w-2xl text-center space-y-6 sm:space-y-8 my-auto">
    <!-- Big 404 Indicator -->
    <div class="space-y-3">
      <p class="text-sm sm:text-base font-bold uppercase tracking-widest text-[#a855f7]">404 Error</p>
      <h1 class="text-6xl sm:text-8xl md:text-9xl font-black tracking-tight text-slate-900 select-none">
        404
      </h1>
      <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">
        Page not found
      </h2>
    </div>

    <!-- Description -->
    <p class="text-sm sm:text-base text-slate-500 max-w-md mx-auto leading-relaxed">
      Sorry, we couldn’t find the page you’re looking for. It might have been moved, deleted, or never existed.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
      <a href="/" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 active:bg-black text-white text-sm font-semibold shadow-sm hover:shadow-md transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Go to Homepage</span>
      </a>
      <button type="button" onclick="window.history.back()" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold transition cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Go Back</span>
      </button>
    </div>
  </main>

  <!-- Clean Bottom Bar -->
  <footer class="text-xs text-slate-400 text-center py-4">
    &copy; 2026 All rights reserved.
  </footer>

</body>
</html>
